<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Darshan</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'App_css/style.css' %}">
</head>

<body class="otp-page">

    <div class="login">

        <form method="post" class="form">

            {% csrf_token %}

            <!-- OTP Icon -->
            <div class="otp-icon">✉</div>

            <!-- Heading -->
            <h2>Verify OTP</h2>

            <!-- Description -->
            <p class="otp-description">
                Enter the 6-digit verification code sent to your email
                to complete the verification process.
            </p>

            <!-- Error Message -->
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <!-- OTP Input -->
            <div>
                <label for="otp">Verification Code</label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="------"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                    autofocus
                >
            </div>

            <!-- Submit Button -->
            <button type="submit">
                Verify OTP
            </button>

            <!-- Footer -->
            <div class="otp-footer">
                <span>🔒 Secure Verification</span>
                <br>
                Please do not share your OTP with anyone.
            </div>

        </form>

    </div>

</body>

</html>
