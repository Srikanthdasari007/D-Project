<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if temple %}
            {{ temple.title }} | Darshan
        {% else %}
            Temple Details | Darshan
        {% endif %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #fff8ed;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .navbar {
            background: #7b1c1c;
        }

        .article-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .article-title {
            color: #8b2500;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .temple-image {
            display: block;
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            margin: 0 auto 30px;
            border-radius: 12px;
        }

        .article-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.9;
            font-size: 16px;
        }

        .back-button {
            background: #8b2500;
            color: white;
            border: none;

        }

        .back-button:hover {
            background: #641b00;
            color: white;
        }
    </style>
</head>

<body>


<nav class="navbar navbar-dark">
    <div class="container">

        <!-- Left side: Logo -->
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            🛕 Darshan
        </a>

        <!-- Right side: Navigation buttons -->
        <div class="d-flex align-items-center gap-3 ms-auto">

            <a href="{% url 'home' %}" class="btn btn-outline-light">
                Home
            </a>

            <a href="{% url 'temple_search' %}" class="btn btn-outline-light">
                Temple Search
            </a>

        </div>

    </div>
</nav>


    <div class="container">

        

                

                
{% if error_message %}

    <div class="alert alert-warning mt-4">
        {{ error_message }}
    </div>

{% elif temple %}

    <article class="article-container">

        <h1 class="article-title">
            {{ temple.title }}
        </h1>

        {% if temple.image %}
            <img
                src="{{ temple.image }}"
                alt="{{ temple.title }}"
                class="temple-image"
            >
        {% endif %}

        <div class="article-text wikipedia-content">
            {{ temple.article_html|safe }}
        </div>

        

    </article>




                <div class="mt-4">
                    <a
                        href="{% url 'temple_search' %}"
                        class="btn back-button"
                    >
                        ← Back to Search
                    </a>
                </div>

            </article>

        {% endif %}

    </div>

</body>
</html>
