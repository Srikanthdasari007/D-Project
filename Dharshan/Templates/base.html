<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Base{% endblock %}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <link rel="stylesheet" href="{% static 'App_css/style.css' %}">

    {% block extra_css %}{% endblock %}
    
</head>

<body>


{% load static %}

<nav class="navbar navbar-dark darshan-navbar">
    <div class="container-fluid">

        <!-- Left side: Temple Logo and Website Name -->
        <a class="navbar-brand fw-bold darshan-brand"
           href="{% url 'home' %}">
            <span class="temple-logo">🛕</span>
            <span>Darshan</span>
        </a>

        <!-- Right side: Navigation Links and Search -->
        <div class="darshan-nav-links">

            <a href="{% url 'home' %}" class="btn btn-outline-light">
                Home
            </a>

            <a href="{% url 'calendar_languages' %}" class="btn btn-outline-light">
                 📅Calendar
            </a>

            <a href="{% url 'about' %}" class="btn btn-outline-light">
                About
            </a>

            <a href="{% url 'Temples' %}" class="btn btn-outline-light">
                Temples
            </a>

            <a href="{% url 'logout' %}" class="btn btn-outline-light">
                Logout
            </a>

            <!-- Temple Search -->
            <form method="GET"
                  action="{% url 'temple_search' %}"
                  class="darshan-search">

                <input
                    type="search"
                    name="q"
                    placeholder="Search temples..."
                    value="{{ query|default:'' }}"
                    aria-label="Search temples"
                    required>

                <button type="submit">Search</button>
            </form>

        </div>
    </div>
</nav>


    <hr>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
